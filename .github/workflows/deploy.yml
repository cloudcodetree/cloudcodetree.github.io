name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege by default; the deploy job elevates to contents:write itself.
permissions:
  contents: read

# Rapid feed pushes can queue overlapping runs; two racing Worker deploys could
# land out of order. Serialize per ref and drop superseded in-flight runs
# (only the newest commit's deploy matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Re-host any feed images that are still on the placeholder (the cloud
  # routine has no Cloudflare token, so its posts land with placeholders; this
  # job uploads the real images to R2 (img.cloudcodetree.com) and commits the
  # URLs). Convergent: a push with nothing to fix commits nothing, and the
  # GITHUB_TOKEN push below doesn't trigger a new workflow run — the build job
  # checks out latest main instead, so the fix ships in THIS run's deploy.
  rehost-images:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: main

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Re-host feed images to R2 (img.cloudcodetree.com)
      env:
        # R2 uploads go through the Cloudflare API with the same token the
        # Worker deploy uses (it carries Workers R2 Storage: Edit).
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Optional: add a free Pexels API key as a repo secret to give posts with
        # no source image a relevant stock photo instead of the placeholder.
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: node scripts/ingest-feed.mjs

    - name: Validate blog index
      run: node scripts/validate-blog.mjs

    - name: Commit re-hosted image URLs (if any)
      run: |
        if git diff --quiet -- public/blog/posts.json; then
          echo "no image changes to commit"
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/blog/posts.json
          git commit -m "blog: re-host images (CI)"
          git push origin main
        fi

    # Cutover leftovers on a timer (runbook step 8). The gh-pages branch and
    # the blog-images Release are cold fallbacks that must not be deleted
    # until the new paths have soaked. Both actions are idempotent; once both
    # are gone this step is a no-op and can be removed.
    - name: Retire cold fallbacks once their soak has passed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        today=$(date -u +%F)
        if [ "$today" \> "2026-09-18" ] && git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
          echo "soak over: deleting the gh-pages branch"
          git push origin --delete gh-pages
        fi
        if [ "$today" \> "2026-09-25" ] && gh release view blog-images >/dev/null 2>&1; then
          echo "soak over: deleting the blog-images Release"
          gh release delete blog-images --yes --cleanup-tag
        fi

  build:
    needs: rehost-images
    # Run for PRs (rehost-images is skipped there) and after it on main pushes.
    if: ${{ !cancelled() && needs.rehost-images.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # On main pushes, build latest main so a rehost-images commit (which
        # can't trigger its own run) is included; empty ref = default for PRs.
        ref: ${{ github.event_name == 'push' && 'main' || '' }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # The suite guards the Worker handlers, the chunker, the feed merger and
    # the rank fusion — none of which validate-blog can see. It ran only on a
    # developer's machine until 2026-09-08, so a broken handler could deploy.
    - name: Unit tests + worker typecheck
      run: |
        pnpm test
        pnpm run typecheck:worker

    - name: Validate blog index
      run: node scripts/validate-blog.mjs

    - name: Validate research log ↔ feed consistency
      run: node scripts/validate-research-log.mjs

    # Search index: embed changed posts (Workers AI) into Vectorize and write
    # public/blog/related.json for the build. Diff-based, so an unchanged
    # corpus makes zero model calls. Never fails the deploy — content always
    # ships; the next push catches the index up.
    - name: Index posts for search
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: node scripts/index-search.mjs || echo "::warning title=search index::index-search failed; search runs keyword-only until the next push"

    - name: Dry-run the search indexer (PR builds)
      if: github.event_name != 'push'
      run: node scripts/index-search.mjs --dry-run

    # The earlier validate runs before related.json exists, so checkRelated()
    # is a no-op there. This one is the only pass that sees the real file — a
    # neighbor pointing at a removed post fails the build here, not in prod.
    - name: Validate blog index (with related.json)
      run: node scripts/validate-blog.mjs

    - name: Build
      run: pnpm run build

    # The production deploy, in the same job as the build (no artifact hop, no
    # second install): cct-site on Cloudflare Workers, serving cloudcodetree.com
    # via the route in wrangler.jsonc. Gated on the repo variable
    # ENABLE_WORKER_DEPLOY=true plus the CLOUDFLARE_API_TOKEN /
    # CLOUDFLARE_ACCOUNT_ID secrets (scripts/set-ci-secrets.mjs sets all three).
    # PR builds stop after `Build`.
    - name: Vendor gated demo builds
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WORKER_DEPLOY == 'true'
      run: node scripts/fetch-demo-artifacts.mjs

    - name: Deploy production Worker
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WORKER_DEPLOY == 'true'
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: deploy

    # A fresh Worker version cold-starts the AI binding: the first /api/search
    # takes 4-8s, past the browser's 2s budget, so search silently degrades to
    # keyword-only for the first visitors. One throwaway query absorbs that.
    # Never fails the deploy — the site is already live at this point.
    - name: Warm the search endpoint
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_WORKER_DEPLOY == 'true'
      run: |
        for i in 1 2 3; do
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://cloudcodetree.com/api/search?q=warmup+$(date +%s)-$i" || true)
          echo "warm-up $i: HTTP $code"
          [ "$code" = "200" ] && exit 0
          sleep 5
        done
        echo "::warning title=search warm-up::endpoint did not return 200; first live search may be keyword-only"

