name: Supabase keepalive

# Free-tier Supabase projects pause after ~7 days of inactivity, and a paused
# project means demo sign-in is down for the next visitor. A portfolio site
# can genuinely go a week without a signup, so this issues a trivial
# PostgREST request twice a week to keep cct-demos warm.
#
# The URL and publishable (anon) key are public by design — they already ship
# committed in app/lib/authConfig.ts and in every built page — so they live
# here inline, not as secrets.

on:
  schedule:
    - cron: '17 9 * * 1,4'   # Mon + Thu 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PostgREST
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://tgcysgioncdmtzcfknix.supabase.co/rest/v1/demo_events?select=id&limit=1" \
            -H "apikey: sb_publishable_xElUD5_ZTjOVM8ZHSZ1lQw_Zq5gto2o" \
            -H "authorization: Bearer sb_publishable_xElUD5_ZTjOVM8ZHSZ1lQw_Zq5gto2o")
          echo "PostgREST responded $code"
          # 200 (empty array — RLS exposes no rows) proves the DB is awake;
          # only 5xx/timeout means trouble.
          case "$code" in
            2*|401|406) echo "project is awake" ;;
            *) echo "unexpected status $code"; exit 1 ;;
          esac
